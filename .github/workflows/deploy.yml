name: Deploy

on:
  push:
    branches: [main]

# One deploy at a time; a second push waits for the first to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The API first, so the web app always has a matching API to talk to.
      - name: Deploy API
        run: flyctl deploy --config fly.api.toml --remote-only --ha=false --depot=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}

      - name: Deploy web
        run: flyctl deploy --remote-only --ha=false --depot=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
