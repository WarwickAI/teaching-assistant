version: "2"
sql:
  - engine: postgresql
    schema: internal/db/schema.sql
    queries: internal/db/query.sql
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: true
        json_tags_case_style: camel
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
