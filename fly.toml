# Fly.io config for the SvelteKit front end. The Go API is a separate app (see fly.api.toml), reached over
# its Flycast address, so both Machines can stop when idle and start on the next request.
app = "teaching-assistant"
primary_region = "lhr"
# Give the server time to finish its requests when a Machine stops.
kill_signal = "SIGTERM"
kill_timeout = 30

[processes]
  web = "node web/build"

[env]
  # SvelteKit serves on this port; Fly's proxy puts the visitor's IP address in this header.
  PORT = "8080"
  ADDRESS_HEADER = "Fly-Client-IP"
  # The API's private address. Fly's proxy starts the API Machine if it is stopped.
  GO_API_URL = "http://teaching-assistant-api.flycast:9000"

[http_service]
  processes = ["web"]
  internal_port = 8080
  force_https = true
  # Stop the Machine when idle and start it on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
